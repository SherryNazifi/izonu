<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · Izonu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --teal: #00C2B8;
      --magenta: #FF2D8A;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #000;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
      position: relative;
      overflow: hidden;
    }
    ::selection { background: hsla(333, 100%, 59%, 0.267); color: #fff; }

    body::before {
      content: "";
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 900px;
      height: 900px;
      background:
        radial-gradient(circle at 30% 40%, rgba(0,194,184,0.16), transparent 55%),
        radial-gradient(circle at 70% 60%, rgba(255,45,138,0.16), transparent 55%);
      filter: blur(20px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
    }

    .brand {
      text-align: center;
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.03em;
      color: #fff;
      margin-bottom: 26px;
      text-decoration: none;
      display: block;
    }

    .toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      background: #141414;
      border: 1px solid #232323;
      border-radius: 10px;
      padding: 4px;
      margin-bottom: 24px;
    }
    .toggle a {
      text-align: center;
      padding: 9px;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #888;
      text-decoration: none;
      border-radius: 7px;
      transition: color .15s, background-color .15s;
    }
    .toggle a:hover { color: #cfcfcf; }
    .toggle a.active {
      color: #0a0a0a;
      background: linear-gradient(135deg, var(--teal), var(--magenta));
    }

    .card {
      background: #121212;
      border: 1px solid #232323;
      border-radius: 14px;
      padding: 34px 30px;
    }

    .card h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 800;
      font-size: 40px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 8px;
    }
    .card .sub {
      font-size: 13.5px;
      color: #7c7c7c;
      line-height: 1.5;
      margin-bottom: 28px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 12.5px;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    input {
      width: 100%;
      background: #1b1b1b;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      color: #e8e8e8;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: #4a4a4a; }
    input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0,194,184,0.12);
    }

    .divider {
      border: none;
      border-top: 1px solid #232323;
      margin: 26px 0;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--teal), var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      background: linear-gradient(135deg, var(--teal), var(--magenta));
      color: #0a0a0a;
      border: none;
      border-radius: 8px;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease, opacity .15s;
    }
    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(255,45,138,0.18);
    }
    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .message {
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }
    .message.success {
      background: #0f2a1a;
      border: 1px solid #1a4a2a;
      color: #4ade80;
    }
    .message.error {
      background: #2a0f0f;
      border: 1px solid #4a1a1a;
      color: #f87171;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      font-size: 12.5px;
      color: #666;
      text-decoration: none;
      transition: color .15s;
    }
    .back:hover { color: #aaa; }
  </style>
</head>
<body>
  <div class="container">
    <a href="/" class="brand">Izonu</a>

    <div class="toggle">
      <a href="/static/login.html">Sign in</a>
      <a href="/static/signup.html" class="active">Sign up</a>
    </div>

    <div class="card">
      <h1>Start monitoring.</h1>
      <p class="sub">Connect your strategy and get alerted the moment it drifts.</p>

      <div class="section-label">Account</div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" />
      </div>

      <hr class="divider" />
      <div class="section-label">Alpaca Credentials</div>

      <div class="form-group">
        <label for="alpaca_api_key">Alpaca API Key</label>
        <input type="text" id="alpaca_api_key" placeholder="PKXXXXXXXXXXXXXXXXXX" />
      </div>

      <div class="form-group">
        <label for="alpaca_secret_key">Alpaca Secret Key</label>
        <input type="password" id="alpaca_secret_key" placeholder="Your secret key" />
      </div>

      <div class="form-group">
        <label for="alpaca_base_url">Alpaca Base URL</label>
        <input type="text" id="alpaca_base_url" value="https://paper-api.alpaca.markets" />
      </div>

      <hr class="divider" />
      <div class="section-label">Alert Settings</div>

      <div class="form-group">
        <label for="backtest_sharpe">Backtest Sharpe Ratio</label>
        <input type="number" id="backtest_sharpe" placeholder="e.g. 1.84" step="0.01" />
      </div>

      <div class="row">
        <div class="form-group">
          <label for="alert_days">Alert Days</label>
          <input type="number" id="alert_days" value="30" min="1" />
        </div>
        <div class="form-group">
          <label for="alert_threshold">Alert Threshold</label>
          <input type="number" id="alert_threshold" value="0.3" step="0.01" min="0" max="1" />
        </div>
      </div>

      <button id="submit-btn" onclick="register()">Create Account</button>

      <div class="message" id="message"></div>
    </div>

    <a href="/static/login.html" class="back">Already have an account? Sign in →</a>
  </div>

  <script>
    async function register() {
      const btn = document.getElementById("submit-btn");
      const msg = document.getElementById("message");

      const email             = document.getElementById("email").value.trim();
      const password          = document.getElementById("password").value;
      const alpaca_api_key    = document.getElementById("alpaca_api_key").value.trim();
      const alpaca_secret_key = document.getElementById("alpaca_secret_key").value.trim();
      const alpaca_base_url   = document.getElementById("alpaca_base_url").value.trim();
      const backtest_sharpe   = parseFloat(document.getElementById("backtest_sharpe").value);
      const alert_days        = parseInt(document.getElementById("alert_days").value);
      const alert_threshold   = parseFloat(document.getElementById("alert_threshold").value);

      if (!email || !password || !alpaca_api_key || !alpaca_secret_key || !alpaca_base_url || isNaN(backtest_sharpe)) {
        msg.className = "message error";
        msg.textContent = "Please fill in all required fields.";
        msg.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating account...";
      msg.style.display = "none";

      try {
        const response = await fetch("/users/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email,
            password,
            alpaca_api_key,
            alpaca_secret_key,
            alpaca_base_url,
            backtest_sharpe,
            alert_days,
            alert_threshold,
          }),
        });

        const data = await response.json();

        if (response.ok) {
          msg.className = "message success";
          msg.textContent = "Account created. You will receive email alerts when strategy drift is detected.";
          msg.style.display = "block";
          btn.textContent = "Account Created";
        } else {
          msg.className = "message error";
          msg.textContent = data.detail || "Something went wrong. Please try again.";
          msg.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Create Account";
        }
      } catch (err) {
        msg.className = "message error";
        msg.textContent = "Could not connect to the server. Make sure the app is running.";
        msg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    }
  </script>
</body>
</html>
