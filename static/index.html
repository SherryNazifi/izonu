<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Izonu</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #e8e8e8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .header {
      margin-bottom: 40px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .header p {
      margin-top: 8px;
      font-size: 14px;
      color: #888;
      line-height: 1.5;
    }

    .card {
      background-color: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    input {
      width: 100%;
      background-color: #1f1f1f;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
      color: #e8e8e8;
      outline: none;
      transition: border-color 0.15s;
    }

    input::placeholder {
      color: #444;
    }

    input:focus {
      border-color: #4a4a4a;
    }

    .divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 24px 0;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 13px;
      background-color: #ffffff;
      color: #0d0d0d;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s, opacity 0.15s;
    }

    button:hover {
      background-color: #e8e8e8;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      display: none;
    }

    .message.success {
      background-color: #0f2a1a;
      border: 1px solid #1a4a2a;
      color: #4ade80;
    }

    .message.error {
      background-color: #2a0f0f;
      border: 1px solid #4a1a1a;
      color: #f87171;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <h1>Izonu</h1>
      <p>A live algo trading strategy monitor. Register your account to start tracking strategy drift and receive email alerts.</p>
    </div>

    <div class="card">
      <div class="section-label">Account</div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" />
      </div>

      <hr class="divider" />
      <div class="section-label">Alpaca Credentials</div>

      <div class="form-group">
        <label for="alpaca_api_key">Alpaca API Key</label>
        <input type="text" id="alpaca_api_key" placeholder="PKXXXXXXXXXXXXXXXXXX" />
      </div>

      <div class="form-group">
        <label for="alpaca_secret_key">Alpaca Secret Key</label>
        <input type="password" id="alpaca_secret_key" placeholder="Your secret key" />
      </div>

      <div class="form-group">
        <label for="alpaca_base_url">Alpaca Base URL</label>
        <input type="text" id="alpaca_base_url" value="https://paper-api.alpaca.markets" />
      </div>

      <hr class="divider" />
      <div class="section-label">Alert Settings</div>

      <div class="form-group">
        <label for="backtest_sharpe">Backtest Sharpe Ratio</label>
        <input type="number" id="backtest_sharpe" placeholder="e.g. 1.84" step="0.01" />
      </div>

      <div class="row">
        <div class="form-group">
          <label for="alert_days">Alert Days</label>
          <input type="number" id="alert_days" value="30" min="1" />
        </div>
        <div class="form-group">
          <label for="alert_threshold">Alert Threshold</label>
          <input type="number" id="alert_threshold" value="0.3" step="0.01" min="0" max="1" />
        </div>
      </div>

      <button id="submit-btn" onclick="register()">Create Account</button>

      <div class="message" id="message"></div>
    </div>

  </div>

  <script>
    async function register() {
      const btn = document.getElementById("submit-btn");
      const msg = document.getElementById("message");

      const email           = document.getElementById("email").value.trim();
      const alpaca_api_key  = document.getElementById("alpaca_api_key").value.trim();
      const alpaca_secret_key = document.getElementById("alpaca_secret_key").value.trim();
      const alpaca_base_url = document.getElementById("alpaca_base_url").value.trim();
      const backtest_sharpe = parseFloat(document.getElementById("backtest_sharpe").value);
      const alert_days      = parseInt(document.getElementById("alert_days").value);
      const alert_threshold = parseFloat(document.getElementById("alert_threshold").value);

      // Basic validation
      if (!email || !alpaca_api_key || !alpaca_secret_key || !alpaca_base_url || isNaN(backtest_sharpe)) {
        msg.className = "message error";
        msg.textContent = "Please fill in all required fields.";
        msg.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating account...";
      msg.style.display = "none";

      try {
        const response = await fetch("/users/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email,
            alpaca_api_key,
            alpaca_secret_key,
            alpaca_base_url,
            backtest_sharpe,
            alert_days,
            alert_threshold,
          }),
        });

        const data = await response.json();

        if (response.ok) {
          msg.className = "message success";
          msg.textContent = "Account created. You will receive email alerts when strategy drift is detected.";
          msg.style.display = "block";
          btn.textContent = "Account Created";
        } else {
          msg.className = "message error";
          msg.textContent = data.detail || "Something went wrong. Please try again.";
          msg.style.display = "block";
          btn.disabled = false;
          btn.textContent = "Create Account";
        }

      } catch (err) {
        msg.className = "message error";
        msg.textContent = "Could not connect to the server. Make sure the app is running.";
        msg.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    }
  </script>
</body>
</html>
